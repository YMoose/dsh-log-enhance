# S1 PR/push gate — see docs/versioning.md §4.
# All third-party actions are pinned to commit SHAs (a gate must not ride a
# floating tag); the comment under each `uses:` records the ref it resolved from.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck, tests, build, compat gate, coupling gate, pack smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # engines.node lower bound (>=24.9.0); "24" resolves to latest 24.x
          node-version: 24
          cache: npm

      - name: Install dependencies exactly as locked
        run: npm ci

      - name: Typecheck, unit + integration tests, build
        run: npm run check

      - name: Run the official dsh compatibility gate on the plugin manifest
        run: npm run check:compat

      # Coupling drift gate: a new hook, value import, or payload field read
      # must be a conscious update of coupling.json — the same semantics as
      # the baseline integrity gate, applied to the source coupling surface.
      - name: Gate the coupling inventory against coupling.json
        run: node scripts/analyze-dsh-coupling.mjs --check

      - name: Pack the publishable tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Unpack the tarball and verify the shipped file set
        run: |
          mkdir smoke
          tar -xzf "$RUNNER_TEMP"/dsh-log-enhance-*.tgz -C smoke
          test -f smoke/package/package.json
          test -f smoke/package/cordis.patch.yml

      # Real host mounting is NOT checked through a third-party action: the
      # seam-verify probe plugin (real Context + real upstream declarations)
      # and the loader-based integration tests own that surface, and they run
      # on every train the CI touches. Workflows carry no version pin at all
      # (single-line follow): the only version state is package.json — the
      # devDeps train and engines.dsh, moved together by
      # scripts/bump-upstream.mjs — plus baseline.json.
